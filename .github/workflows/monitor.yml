name: check precios

on:
  schedule:
    - cron: 17 * * * *
  push:
    branches:
      - main
  pull_request:
    branches:
      - main  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Instalar navegadores de Playwright
        run: playwright install chromium          

      - name: Ejecutar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN || secrets.bot_token || secrets.telegram_bot_token }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.bot_token || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || vars.CHAT_ID || vars.chat_id || vars.telegram_chat_id || secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID || secrets.chat_id || secrets.telegram_chat_id }}
          CHAT_ID: ${{ vars.CHAT_ID || vars.chat_id || vars.TELEGRAM_CHAT_ID || secrets.CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python monitor.py

      - name: Guardar histórico y estado
        uses: ./.github/actions/commit-and-push
        with:
          files: historico.csv monitor_state.json
          commit_message: "Actualizar histórico de precios [skip ci]"
