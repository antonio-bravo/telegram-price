name: Monitor universal de precios

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: write

# concurrency:
#   group: monitor-universal-precios
#   cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python monitor.py

      - name: Guardar histórico y estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add historico.csv monitor_state.json

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar histórico de precios [skip ci]"
            git pull --rebase origin main
            git push
          fi
