version: "3.8"

services:
  price-monitor:
    # Imagen oficial precompilada en GitHub Packages (multi-arquitectura: amd64 / arm64)
    image: ghcr.io/antonio-bravo/telegram-price:latest
    
    # Descomenta 'build' si prefieres compilar la imagen localmente en tu NAS:
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile

    container_name: price-monitor
    restart: unless-stopped
    pull_policy: always

    # Etiqueta obligatoria para que Watchtower actualice este contenedor
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

    ports:
      # ============================================================
      # PANEL WEB (Accede desde navegador a http://<IP_NAS>:9999)
      # ============================================================
      - "9999:9999"

    environment:
      # ============================================================
      # CREDENCIALES DE TELEGRAM (Inyecta aquí tus valores directamente)
      # ============================================================
      - TELEGRAM_BOT_TOKEN=TU_BOT_TOKEN_AQUI
      - TELEGRAM_CHAT_ID=TU_CHAT_ID_AQUI

      # ============================================================
      # PARÁMETROS DEL MONITOR Y PANEL WEB
      # ============================================================
      # Intervalo en minutos entre cada búsqueda (ejemplo: 15, 30, 60, 120).
      # Puedes modificarlo aquí o directamente en vivo desde la pestaña "Ajustes Globales" del panel web
      - CHECK_INTERVAL_MINUTES=60

      # Realizar una comprobación inmediata al arrancar el contenedor
      - RUN_ON_STARTUP=true

      # Modo Residencial: al ejecutarse en tu NAS con IP doméstica, permite consultar
      # tiendas como Amazon, Wallapop y Vinted directamente sin bloqueos de IP
      - MODO_RESIDENCIAL=true

      # Panel web local (puerto 9999)
      - WEB_PORT=9999
      - WEB_ENABLED=true

      # ============================================================
      # AUTENTICACIÓN WEB OPCIONAL (HTTP Basic Auth)
      # ============================================================
      # Descomenta y asigna si deseas proteger el acceso web con contraseña:
      # - AUTH_USER=admin
      # - AUTH_PASSWORD=tu_password_segura

      # ============================================================
      # SINCRONIZACIÓN CON GITHUB (OPCIONAL / RENDER.COM / NUBE)
      # ============================================================
      # - GITHUB_TOKEN=ghp_xxxxxxxxxxxx
      # - GITHUB_REPO=antonio-bravo/telegram-price
      # - GITHUB_BRANCH=main

      # Zona horaria para las fechas y horas del registro
      - TZ=Europe/Madrid
      - PYTHONUNBUFFERED=1

      - DATA_DIR=/app/data

    volumes:
      # ============================================================
      # PERSISTENCIA DE DATOS
      # ============================================================
      # Mapea los archivos del host dentro del contenedor.
      # Asegúrate de que config.json esté en la misma carpeta que este docker-compose.yml
      # - ./config.json:/app/config.json
      # - ./monitor_state.json:/app/monitor_state.json
      # - ./historico.csv:/app/historico.csv

      # NOTA ALTERNATIVA: Si prefieres mapear una carpeta completa 'data', usa:
      - ./data:/app/data
      # y añade en environment: - DATA_DIR=/app/data

  watchtower:
    image: containrrr/watchtower:latest
    container_name: price-monitor-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Europe/Madrid
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      # Ejecuta la comprobación todos los dias a las 06:30 hora peninsular
      - WATCHTOWER_SCHEDULE=0 30 6 * * *