name: Monitor universal de precios

on:
  schedule:
    # Comprobar cada hora (al minuto 17)
    - cron: "17 * * * *"

  # Permitir ejecución manual desde la pestaña Actions de GitHub
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-universal-precios
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar repositorio
      - name: Descargar repositorio
        uses: actions/checkout@v7

      # 2. Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Ejecutar monitor universal
      - name: Ejecutar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python monitor.py

      # 5. Guardar histórico y estado
      - name: Guardar histórico y estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add historico.csv monitor_state.json

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar histórico de precios [skip ci]"
            git pull --rebase origin main
            git push
          fi
